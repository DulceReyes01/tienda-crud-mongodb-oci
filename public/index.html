<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Catálogo | Cloud Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-hover: #334155;
      --border: #334155;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --danger: #f43f5e;
      --danger-hover: #e11d48;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --badge-bg: #0369a1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 40px 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 35px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    header .status {
      font-size: 0.85rem;
      background-color: #064e3b;
      color: #34d399;
      padding: 6px 14px;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    header .status-dot {
      width: 8px;
      height: 8px;
      background-color: #34d399;
      border-radius: 50%;
    }

    .card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 30px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    .card h2 {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 18px;
      color: var(--text);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    input {
      background-color: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--primary);
    }

    .btn-submit {
      grid-column: 1 / -1;
      background-color: var(--primary);
      color: #0f172a;
      border: none;
      padding: 12px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 5px;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      padding: 14px 16px;
      font-size: 0.8rem;
      text-transform: uppercase;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      letter-spacing: 0.5px;
    }

    td {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }

    tbody tr:hover {
      background-color: var(--surface-hover);
    }

    .badge-sku {
      font-family: monospace;
      background: #0284c7;
      color: white;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .price {
      font-weight: 600;
      color: #38bdf8;
    }

    .btn-delete {
      background-color: var(--danger);
      color: white;
      border: none;
      padding: 7px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 500;
      transition: background-color 0.2s;
    }

    .btn-delete:hover {
      background-color: var(--danger-hover);
    }

    .empty-state {
      text-align: center;
      padding: 30px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1>Catálogo de Inventario</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 4px;">Gestión Centralizada NoSQL en Oracle Cloud</p>
      </div>
      <div class="status">
        <span class="status-dot"></span> API REST Activa
      </div>
    </header>

    <div class="card">
      <h2>Registrar Producto</h2>
      <form id="formProducto" class="form-grid">
        <div class="input-group">
          <label for="sku">Código SKU</label>
          <input type="text" id="sku" placeholder="Ej. ELEC-003" required>
        </div>
        <div class="input-group">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" placeholder="Ej. Monitor 144Hz" required>
        </div>
        <div class="input-group">
          <label for="categoria">Categoría</label>
          <input type="text" id="categoria" placeholder="Ej. Electrónica" required>
        </div>
        <div class="input-group">
          <label for="precio">Precio ($)</label>
          <input type="number" id="precio" step="0.01" placeholder="0.00" required>
        </div>
        <div class="input-group">
          <label for="stock">Stock disponible</label>
          <input type="number" id="stock" placeholder="0" required>
        </div>
        <button type="submit" class="btn-submit">Guardar en Base de Datos</button>
      </form>
    </div>

    <div class="card">
      <h2>Productos Registrados</h2>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>SKU</th>
              <th>Producto</th>
              <th>Categoría</th>
              <th>Precio</th>
              <th>Stock</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="tablaProductos">
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const API_URL = '/api/productos';

    async function cargarProductos() {
      try {
        const res = await fetch(API_URL);
        const productos = await res.json();
        const tbody = document.getElementById('tablaProductos');
        tbody.innerHTML = '';

        if (productos.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" class="empty-state">No hay productos en inventario. Registra uno arriba.</td></tr>`;
          return;
        }

        productos.forEach(p => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><span class="badge-sku">${p.sku}</span></td>
            <td><strong>${p.nombre}</strong></td>
            <td>${p.categoria}</td>
            <td class="price">$${Number(p.precio).toFixed(2)}</td>
            <td>${p.stock} pz</td>
            <td>
              <button class="btn-delete" onclick="eliminarProducto('${p.sku}')">Eliminar</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (error) {
        console.error('Error cargando productos:', error);
      }
    }

    document.getElementById('formProducto').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nuevo = {
        sku: document.getElementById('sku').value.trim(),
        nombre: document.getElementById('nombre').value.trim(),
        categoria: document.getElementById('categoria').value.trim(),
        precio: parseFloat(document.getElementById('precio').value),
        stock: parseInt(document.getElementById('stock').value)
      };

      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(nuevo)
      });

      document.getElementById('formProducto').reset();
      cargarProductos();
    });

    async function eliminarProducto(sku) {
      if (confirm(`¿Deseas eliminar permanentemente el producto con SKU ${sku}?`)) {
        await fetch(`${API_URL}/${sku}`, { method: 'DELETE' });
        cargarProductos();
      }
    }

    window.onload = cargarProductos;
  </script>
</body>
</html>
